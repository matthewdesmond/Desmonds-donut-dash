<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">
<title>Desmond's Donut Dash</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, Helvetica, sans-serif;
}

#game {
  position: relative;
  width: min(100vw, 66.6667vh);
  height: min(150vw, 100vh);
  aspect-ratio: 2 / 3;
  overflow: hidden;
  background: #000;
}

#art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
  user-select: none;
  pointer-events: none;
}

/* Invisible accessible controls */
.hotspot {
  position: absolute;
  z-index: 20;
  border: 0;
  background: transparent;
  padding: 0;
  margin: 0;
  cursor: pointer;
  opacity: 0;
}

.hotspot:focus {
  opacity: 0.08;
  outline: 3px solid white;
  border-radius: 8px;
}

#status {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>
</head>

<body>

<div id="game">

  <!-- YOUR EXACT ARTWORK -->
  <img
    id="art"
    src="template.jpg"
    alt=""
    aria-hidden="true"
  >

  <!-- SCREEN READER STATUS -->
  <div id="status" aria-live="polite"></div>

  <!-- =====================================================
       DONUT CREATION
       ===================================================== -->

  <button
    class="hotspot"
    style="left:4%;top:68%;width:53%;height:8%;"
    aria-label="Make donut"
    onclick="makeDonut()">
  </button>

  <!-- Donut types -->
  <button
    class="hotspot"
    style="left:5%;top:33%;width:9%;height:9%;"
    aria-label="Chocolate donut"
    onclick="chooseDonut('Chocolate')">
  </button>

  <button
    class="hotspot"
    style="left:16%;top:33%;width:9%;height:9%;"
    aria-label="Strawberry donut"
    onclick="chooseDonut('Strawberry')">
  </button>

  <button
    class="hotspot"
    style="left:27%;top:33%;width:9%;height:9%;"
    aria-label="Maple donut"
    onclick="chooseDonut('Maple')">
  </button>

  <!-- Fillings -->
  <button
    class="hotspot"
    style="left:5%;top:46%;width:9%;height:9%;"
    aria-label="Chocolate filling"
    onclick="chooseFilling('Chocolate')">
  </button>

  <button
    class="hotspot"
    style="left:16%;top:46%;width:9%;height:9%;"
    aria-label="Cream filling"
    onclick="chooseFilling('Cream')">
  </button>

  <button
    class="hotspot"
    style="left:27%;top:46%;width:9%;height:9%;"
    aria-label="Strawberry filling"
    onclick="chooseFilling('Strawberry')">
  </button>

  <!-- Toppings -->
  <button
    class="hotspot"
    style="left:5%;top:59%;width:9%;height:8.5%;"
    aria-label="Sprinkles"
    onclick="chooseTopping('Sprinkles')">
  </button>

  <button
    class="hotspot"
    style="left:16%;top:59%;width:9%;height:8.5%;"
    aria-label="Chocolate chips"
    onclick="chooseTopping('Chocolate Chips')">
  </button>

  <button
    class="hotspot"
    style="left:27%;top:59%;width:9%;height:8.5%;"
    aria-label="Glaze"
    onclick="chooseTopping('Glaze')">
  </button>


  <!-- =====================================================
       ORDERS
       ===================================================== -->

  <button
    class="hotspot"
    style="left:61%;top:31%;width:37%;height:7%;"
    aria-label="Chocolate order"
    onclick="fillOrder('Chocolate')">
  </button>

  <button
    class="hotspot"
    style="left:61%;top:38.5%;width:37%;height:7%;"
    aria-label="Strawberry order"
    onclick="fillOrder('Strawberry')">
  </button>

  <button
    class="hotspot"
    style="left:61%;top:46%;width:37%;height:7%;"
    aria-label="Maple order"
    onclick="fillOrder('Maple')">
  </button>


  <!-- Customer -->
  <button
    class="hotspot"
    style="left:61%;top:51%;width:37%;height:7%;"
    aria-label="Customer"
    onclick="serveCustomer()">
  </button>


  <!-- =====================================================
       GALACTIC DONUT
       ===================================================== -->

  <button
    class="hotspot"
    style="left:61%;top:58%;width:37%;height:17%;"
    aria-label="Galactic Donut"
    onclick="galacticDonut()">
  </button>


  <!-- =====================================================
       BOTTOM NAVIGATION
       ===================================================== -->

  <button
    class="hotspot"
    style="left:1%;top:78%;width:14.5%;height:9.5%;"
    aria-label="Upgrades"
    onclick="openMenu('Upgrades')">
  </button>

  <button
    class="hotspot"
    style="left:17%;top:78%;width:14.5%;height:9.5%;"
    aria-label="Locations"
    onclick="openMenu('Locations')">
  </button>

  <button
    class="hotspot"
    style="left:33%;top:78%;width:14.5%;height:9.5%;"
    aria-label="Seasonal"
    onclick="openMenu('Seasonal')">
  </button>

  <button
    class="hotspot"
    style="left:49%;top:78%;width:14.5%;height:9.5%;"
    aria-label="Mystery"
    onclick="openMenu('Mystery')">
  </button>

  <button
    class="hotspot"
    style="left:65%;top:78%;width:14.5%;height:9.5%;"
    aria-label="Donut Rap"
    onclick="openMenu('Donut Rap')">
  </button>

  <button
    class="hotspot"
    style="left:81%;top:78%;width:14.5%;height:9.5%;"
    aria-label="Achievements"
    onclick="openMenu('Achievements')">
  </button>


  <!-- =====================================================
       COLLECT / COSMIC RUSH / INFO
       ===================================================== -->

  <button
    class="hotspot"
    style="left:3%;top:89%;width:28%;height:8%;"
    aria-label="Collect idle earnings"
    onclick="collectEarnings()">
  </button>

  <button
    class="hotspot"
    style="left:34%;top:89%;width:38%;height:8%;"
    aria-label="Cosmic Rush"
    onclick="activateCosmicRush()">
  </button>

  <button
    class="hotspot"
    style="left:76%;top:88%;width:22%;height:10%;"
    aria-label="Game information"
    onclick="showInfo()">
  </button>

</div>


<script>

/* ============================================================
   GAME STATE
   ============================================================ */

let cash = 1248750;

let idlePerSecond = 485;

let bakerBucks = 52;

let crowns = 8;

let level = 1;

let xp = 0;

let goldenDonuts = 0;

let cosmicRushSeconds = 3599;

let cosmicRushActive = true;

let selectedDonut = "Chocolate";

let selectedFilling = "None";

let selectedTopping = "None";


/* ============================================================
   SCREEN READER / VOICEOVER
   ============================================================ */

function speak(message) {

  const status = document.getElementById("status");

  status.textContent = "";

  setTimeout(() => {
    status.textContent = message;
  }, 20);

  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();

    const speech =
      new SpeechSynthesisUtterance(message);

    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
  }
}


/* ============================================================
   IDLE MONEY
   ============================================================ */

setInterval(() => {

  cash += idlePerSecond;

  if (cosmicRushActive) {
    cosmicRushSeconds--;

    if (cosmicRushSeconds <= 0) {
      cosmicRushSeconds = 0;
      cosmicRushActive = false;
      speak("Cosmic Rush has ended.");
    }
  }

}, 1000);


/* ============================================================
   DONUT SELECTION
   ============================================================ */

function chooseDonut(type) {

  selectedDonut = type;

  speak(type + " donut selected.");
}


function chooseFilling(type) {

  selectedFilling = type;

  speak(type + " filling selected.");
}


function chooseTopping(type) {

  selectedTopping = type;

  speak(type + " topping selected.");
}


/* ============================================================
   MAKE DONUT
   ============================================================ */

function makeDonut() {

  let message =
    "Made a " +
    selectedDonut +
    " donut with " +
    selectedFilling +
    " filling and " +
    selectedTopping +
    " topping.";

  /*
     GOLDEN DONUT
     Rare prize: approximately 6% chance.
  */

  if (Math.random() < 0.06) {

    goldenDonuts++;

    bakerBucks += 12;

    idlePerSecond += 50;

    message +=
      " Golden Donut! Rare prize! " +
      "You earned 12 Baker Bucks and " +
      "50 dollars per second.";
  }

  xp += 10;

  if (xp >= 100) {

    xp -= 100;

    level++;

    message +=
      " Level up! You are now level " +
      level + ".";
  }

  speak(message);
}


/* ============================================================
   ORDERS
   ============================================================ */

const orderValues = {

  Chocolate: 42,

  Strawberry: 56,

  Maple: 48
};


function fillOrder(type) {

  let payout = orderValues[type] || 25;

  if (cosmicRushActive) {
    payout *= 2;
  }

  cash += payout;

  xp += 8;

  speak(
    type +
    " order completed. " +
    "You earned $" +
    payout +
    "."
  );
}


/* ============================================================
   CUSTOMER
   ============================================================ */

function serveCustomer() {

  cash += cosmicRushActive ? 100 : 50;

  xp += 15;

  speak(
    "Customer served. " +
    "Great job, donut boss!"
  );
}


/* ============================================================
   GALACTIC DONUT
   ============================================================ */

function galacticDonut() {

  cosmicRushActive = true;

  cosmicRushSeconds = 3599;

  speak(
    "Galactic Donut activated! " +
    "Cosmic Rush is now active. " +
    "Idle earnings are tripled and " +
    "order payouts are doubled."
  );
}


/* ============================================================
   COLLECT
   ============================================================ */

function collectEarnings() {

  let multiplier =
    cosmicRushActive ? 3 : 1;

  let amount =
    idlePerSecond * 10 * multiplier;

  cash += amount;

  speak(
    "Collected $" +
    amount +
    " in idle earnings."
  );
}


/* ============================================================
   COSMIC RUSH
   ============================================================ */

function activateCosmicRush() {

  if (bakerBucks < 10) {

    speak(
      "You need 10 Baker Bucks " +
      "to activate Cosmic Rush."
    );

    return;
  }

  bakerBucks -= 10;

  cosmicRushActive = true;

  cosmicRushSeconds = 600;

  speak(
    "Cosmic Rush activated for " +
    "10 minutes!"
  );
}


/* ============================================================
   BOTTOM MENUS
   ============================================================ */

function openMenu(menu) {

  switch(menu) {

    case "Upgrades":

      idlePerSecond += 25;

      speak(
        "Upgrades opened. " +
        "Your earnings increased by " +
        "25 dollars per second."
      );

      break;


    case "Locations":

      speak(
        "Locations opened. " +
        "New donut shops are coming soon."
      );

      break;


    case "Seasonal":

      speak(
        "Seasonal shop opened. " +
        "Limited time donuts coming soon."
      );

      break;


    case "Mystery":

      speak(
        "Mystery shop opened. " +
        "You never know what you'll find."
      );

      break;


    case "Donut Rap":

      speak(
        "Donut Rap activated! " +
        "Drop that donut beat!"
      );

      break;


    case "Achievements":

      speak(
        "Achievements opened. " +
        "You have earned " +
        goldenDonuts +
        " Golden Donuts."
      );

      break;
  }
}


/* ============================================================
   INFO
   ============================================================ */

function showInfo() {

  speak(
    "Desmond's Donut Dash. " +
    "You currently earn " +
    idlePerSecond +
    " dollars per second. " +
    "You have " +
    bakerBucks +
    " Baker Bucks, " +
    goldenDonuts +
    " Golden Donuts, and are level " +
    level +
    "."
  );
}


/* ============================================================
   KEYBOARD ACCESSIBILITY
   ============================================================ */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {

      speak(
        "Desmond's Donut Dash."
      );
    }

  }
);

</script>

</body>
</html>
