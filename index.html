<title>Desmond's Donut Dash</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, Helvetica, sans-serif;
}

#game {
  position: relative;

  width: min(100vw, 66.6667vh);
  height: min(150vw, 100vh);

  aspect-ratio: 2 / 3;

  overflow: hidden;

  background: #000;
}

/* ==========================================================
   EXACT ORIGINAL GAME ARTWORK
   ========================================================== */

#art {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: fill;

  display: block;

  user-select: none;

  pointer-events: none;
}


/* ==========================================================
   INVISIBLE ACCESSIBLE GAME CONTROLS
   ========================================================== */

.hotspot {

  position: absolute;

  z-index: 20;

  border: 0;

  background: transparent;

  padding: 0;
  margin: 0;

  cursor: pointer;

  opacity: 0;
}

.hotspot:focus {

  opacity: 0.08;

  outline: 3px solid white;

  border-radius: 8px;
}


/* ==========================================================
   VOICEOVER STATUS
   ========================================================== */

#status {

  position: absolute;

  width: 1px;
  height: 1px;

  overflow: hidden;

  clip: rect(0 0 0 0);

  white-space: nowrap;
}

</style>
</head>

  "

<script>


/* ==========================================================
   GAME STATE
   ========================================================== */

let cash = 1248750;

let idlePerSecond = 485;

let bakerBucks = 52;

let crowns = 8;

let level = 1;

let xp = 0;

let goldenDonuts = 0;

let cosmicRushSeconds = 3599;

let cosmicRushActive = true;

let selectedDonut = "Classic";

let selectedFilling = "Vanilla";

let selectedTopping = "Sprinkles";


/* ==========================================================
   VOICEOVER / SPEECH
   ========================================================== */

function speak(message) {

  const status =
    document.getElementById("status");

  status.textContent = "";

  setTimeout(function() {

    status.textContent = message;

  }, 20);


  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();

    const speech =
      new SpeechSynthesisUtterance(message);

    speech.rate = 1;

    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
  }
}


/* ==========================================================
   IDLE EARNINGS
   ========================================================== */

setInterval(function() {

  cash += idlePerSecond;


  if (cosmicRushActive) {

    cosmicRushSeconds--;

    if (cosmicRushSeconds <= 0) {

      cosmicRushSeconds = 0;

      cosmicRushActive = false;

      speak(
        "Cosmic Rush has ended."
      );
    }
  }

}, 1000);


/* ==========================================================
   DONUT SELECTION
   ========================================================== */

function chooseDonut(type) {

  selectedDonut = type;

  speak(
    type +
    " donut selected."
  );
}


function chooseFilling(type) {

  selectedFilling = type;

  speak(
    type +
    " filling selected."
  );
}


function chooseTopping(type) {

  selectedTopping = type;

  speak(
    type +
    " topping selected."
  );
}


/* ==========================================================
   MAKE DONUT
   ========================================================== */

function makeDonut() {

  let message =
    "Made a " +
    selectedDonut +
    " donut with " +
    selectedFilling +
    " filling and " +
    selectedTopping +
    " topping.";


  /*
     GOLDEN DONUT
     
     Rare prize:
     6 percent chance.
  */

  if (Math.random() < 0.06) {

    goldenDonuts++;

    bakerBucks += 12;

    idlePerSecond += 50;


    message +=
      " Golden Donut! " +
      "Rare prize! " +
      "You earned 12 Baker Bucks " +
      "and 50 dollars per second.";
  }


  xp += 10;


  if (xp >= 100) {

    xp -= 100;

    level++;


    message +=
      " Level up! " +
      "You are now level " +
      level +
      ".";
  }


  speak(message);
}


/* ==========================================================
   ORDER VALUES
   ========================================================== */

const orderValues = {

  Chocolate: 42,

  Strawberry: 56,

  Maple: 48

};


/* ==========================================================
   COMPLETE ORDER
   ========================================================== */

function fillOrder(type) {

  let payout =
    orderValues[type] || 25;


  if (cosmicRushActive) {

    payout *= 2;
  }


  cash += payout;

  xp += 8;


  speak(
    type +
    " order completed. " +
    "You earned $" +
    payout +
    "."
  );
}


/* ==========================================================
   CUSTOMER
   ========================================================== */

function serveCustomer() {

  let amount =
    cosmicRushActive
    ? 100
    : 50;


  cash += amount;

  xp += 15;


  speak(
    "Customer served. " +
    "You earned $" +
    amount +
    ". Great job, donut boss!"
  );
}


/* ==========================================================
   GALACTIC DONUT
   ========================================================== */

function galacticDonut() {

  cosmicRushActive = true;

  cosmicRushSeconds = 3599;


  speak(
    "Galactic Donut activated! " +
    "Cosmic Rush is active. " +
    "Idle earnings are tripled " +
    "and order payouts are doubled."
  );
}


/* ==========================================================
   COLLECT IDLE EARNINGS
   ========================================================== */

function collectEarnings() {

  let multiplier =
    cosmicRushActive
    ? 3
    : 1;


  let amount =
    idlePerSecond *
    10 *
    multiplier;


  cash += amount;


  speak(
    "Collected $" +
    amount +
    " in idle earnings."
  );
}


/* ==========================================================
   COSMIC RUSH
   ========================================================== */

function activateCosmicRush() {

  if (bakerBucks < 10) {

    speak(
      "You need 10 Baker Bucks " +
      "to activate Cosmic Rush."
    );

    return;
  }


  bakerBucks -= 10;

  cosmicRushActive = true;

  cosmicRushSeconds = 600;


  speak(
    "Cosmic Rush activated " +
    "for 10 minutes!"
  );
}


/* ==========================================================
   BOTTOM MENUS
   ========================================================== */

function openMenu(menu) {


  if (menu === "Upgrades") {

    idlePerSecond += 25;


    speak(
      "Upgrades opened. " +
      "Your earnings increased by " +
      "25 dollars per second."
    );

    return;
  }


  if (menu === "Locations") {

    speak(
      "Locations opened. " +
      "New donut shops are coming soon."
    );

    return;
  }


  if (menu === "Seasonal") {

    speak(
      "Seasonal shop opened. " +
      "Limited time donuts are coming soon."
    );

    return;
  }


  if (menu === "Mystery") {

    speak(
      "Mystery shop opened. " +
      "You never know what you will find."
    );

    return;
  }


  if (menu === "Donut Rap") {

    speak(
      "Donut Rap activated! " +
      "Drop that donut beat!"
    );

    return;
  }


  if (menu === "Achievements") {

    speak(
      "Achievements opened. " +
      "You have earned " +
      goldenDonuts +
      " Golden Donuts."
    );

    return;
  }

}


/* ==========================================================
   GAME INFORMATION
   ========================================================== */

function showInfo() {

  speak(
    "Desmond's Donut Dash. " +
    "You currently earn " +
    idlePerSecond +
    " dollars per second. " +
    "You have " +
    bakerBucks +
    " Baker Bucks, " +
    goldenDonuts +
    " Golden Donuts, " +
    "and you are level " +
    level +
    "."
  );
}


/* ==========================================================
   KEYBOARD ACCESSIBILITY
   ========================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {

      speak(
        "Desmond's Donut Dash."
      );
    }

  }
);

</script>
