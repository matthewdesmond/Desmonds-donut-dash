<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desmond's Donut Dash</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #fff4e6;
  color: #3b2416;
  margin: 0;
  padding: 16px;
}

h1 {
  text-align: center;
  font-size: 28px;
}

h2 {
  margin-bottom: 8px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat {
  background: #fff0d9;
  padding: 12px;
  border-radius: 10px;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 15px;
  margin: 6px 0;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  background: #d2691e;
  color: white;
}

button:disabled {
  background: #aaa;
}

.order {
  background: #fff8ef;
  border: 2px solid #d2691e;
  border-radius: 12px;
  padding: 14px;
  font-size: 20px;
  margin: 10px 0;
}

.selected {
  background: #8b4513 !important;
}

#announcement {
  position: absolute;
  left: -9999px;
}

.small {
  font-size: 14px;
  color: #666;
}
</style>
</head>

<body>

<h1>🍩 Desmond's Donut Dash</h1>

<div id="announcement" aria-live="assertive"></div>

<div class="card">
  <h2>Shop Status</h2>

  <div class="stats">
    <div class="stat">
      💰 Cash: $<span id="cash">50</span>
    </div>

    <div class="stat">
      🍩 Sold: <span id="sold">0</span>
    </div>

    <div class="stat">
      ⭐ Level: <span id="level">1</span>
    </div>

    <div class="stat">
      📈 Next Goal: <span id="nextGoal">10</span>
    </div>
  </div>

  <p id="levelName">New Shop</p>
</div>

<div class="card">
  <h2>👤 Customer</h2>

  <div id="customerStatus">
    No customer is waiting.
  </div>

  <button id="takeOrderButton" onclick="takeOrder()">
    Take Order
  </button>

  <div id="orderArea"></div>
</div>

<div class="card">
  <h2>🍩 Donuts</h2>

  <p class="small">
    Select the donuts needed for the customer's order.
  </p>

  <div id="donutButtons"></div>

  <button id="serveButton" onclick="serveOrder()" disabled>
    Serve Order
  </button>

  <button onclick="clearSelection()">
    Clear Selection
  </button>
</div>

<div class="card">
  <h2>⬆️ Shop Upgrades</h2>

  <button onclick="upgrade('oven')">
    Upgrade Oven
  </button>

  <button onclick="upgrade('recipes')">
    Upgrade Recipes
  </button>

  <button onclick="upgrade('helper')">
    Hire / Upgrade Helper
  </button>

  <button onclick="upgrade('display')">
    Upgrade Display Case
  </button>

  <button onclick="upgrade('coffee')">
    Upgrade Coffee Station
  </button>

  <p id="upgradeStatus"></p>
</div>

<div class="card">
  <h2>📊 Shop Report</h2>

  <button onclick="shopReport()">
    Hear Shop Report
  </button>

  <button onclick="newGame()">
    Start New Game
  </button>
</div>

<script>

let game = {
  cash: 50,
  sold: 0,
  level: 1,

  upgrades: {
    oven: 0,
    recipes: 0,
    helper: 0,
    display: 0,
    coffee: 0
  },

  currentOrder: null,
  selected: {}
};

const levelNames = [
  "",
  "New Shop",
  "Neighborhood Favorite",
  "Donut Star",
  "Donut Champion",
  "Donut Legend",
  "Master Baker",
  "Donut Empire"
];

const donuts = [
  {
    id: "glazed",
    name: "Glazed",
    price: 4,
    unlock: 0
  },
  {
    id: "chocolate",
    name: "Chocolate",
    price: 6,
    unlock: 0
  },
  {
    id: "jelly",
    name: "Jelly Filled",
    price: 8,
    unlock: 0
  },
  {
    id: "cinnamon",
    name: "Cinnamon Sugar",
    price: 10,
    unlock: 10
  },
  {
    id: "maple",
    name: "Maple Bacon",
    price: 14,
    unlock: 25
  },
  {
    id: "boston",
    name: "Boston Cream",
    price: 16,
    unlock: 50
  },
  {
    id: "rainbow",
    name: "Rainbow Sprinkle",
    price: 20,
    unlock: 100
  },
  {
    id: "dream",
    name: "Desmond's Dream",
    price: 30,
    unlock: 200
  }
];

const milestones = [
  {
    sales: 10,
    level: 2,
    reward: 25,
    donut: "cinnamon"
  },
  {
    sales: 25,
    level: 3,
    reward: 50,
    donut: "maple"
  },
  {
    sales: 50,
    level: 4,
    reward: 100,
    donut: "boston"
  },
  {
    sales: 100,
    level: 5,
    reward: 200,
    donut: "rainbow"
  },
  {
    sales: 200,
    level: 6,
    reward: 400,
    donut: "dream"
  }
];

function saveGame() {
  localStorage.setItem(
    "desmondsDonutDash",
    JSON.stringify(game)
  );
}

function loadGame() {

  const saved = localStorage.getItem(
    "desmondsDonutDash"
  );

  if (saved) {
    try {
      game = JSON.parse(saved);
    } catch (e) {
      console.log("Save could not be loaded.");
    }
  }

  if (!game.upgrades) {
    game.upgrades = {
      oven: 0,
      recipes: 0,
      helper: 0,
      display: 0,
      coffee: 0
    };
  }

  game.currentOrder = null;
  game.selected = {};

  updateScreen();
}

function speak(text) {

  const announcement =
    document.getElementById("announcement");

  announcement.textContent = "";

  setTimeout(() => {
    announcement.textContent = text;
  }, 50);

  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();

    const speech =
      new SpeechSynthesisUtterance(text);

    speech.rate = 0.95;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
  }
}

function getUnlockedDonuts() {

  return donuts.filter(d =>
    game.sold >= d.unlock
  );
}

function getMaxOrderSize() {

  if (game.level <= 1) return 1;
  if (game.level <= 2) return 2;
  if (game.level <= 4) return 3;
  if (game.level <= 6) return 4;

  return 5;
}

function takeOrder() {

  if (game.currentOrder) {

    speak(
      "You already have an order. Choose the donuts and serve it."
    );

    return;
  }

  const available = getUnlockedDonuts();

  const maxSize = getMaxOrderSize();

  const orderSize =
    Math.floor(Math.random() * maxSize) + 1;

  const order = {};

  for (let i = 0; i < orderSize; i++) {

    const donut =
      available[
        Math.floor(Math.random() * available.length)
      ];

    if (!order[donut.id]) {
      order[donut.id] = 0;
    }

    order[donut.id]++;
  }

  game.currentOrder = order;
  game.selected = {};

  displayOrder();

  const spokenOrder =
    orderToSpeech(order);

  speak(
    "New customer. Your order is: " +
    spokenOrder +
    "."
  );

  updateScreen();
}

function orderToSpeech(order) {

  const parts = [];

  Object.keys(order).forEach(id => {

    const donut =
      donuts.find(d => d.id === id);

    const amount = order[id];

    if (amount === 1) {
      parts.push("1 " + donut.name);
    } else {
      parts.push(
        amount + " " +
        donut.name + " donuts"
      );
    }
  });

  if (parts.length === 1) {
    return parts[0];
  }

  if (parts.length === 2) {
    return parts[0] +
      " and " +
      parts[1];
  }

  return parts.slice(0, -1).join(", ") +
    ", and " +
    parts[parts.length - 1];
}

function displayOrder() {

  const area =
    document.getElementById("orderArea");

  if (!game.currentOrder) {

    area.innerHTML = "";

    return;
  }

  area.innerHTML = `
    <div class="order" tabindex="0">
      <strong>Current Order:</strong><br>
      ${orderToSpeech(game.currentOrder)}
    </div>
  `;
}

function createDonutButtons() {

  const container =
    document.getElementById("donutButtons");

  container.innerHTML = "";

  getUnlockedDonuts().forEach(donut => {

    const button =
      document.createElement("button");

    button.textContent =
      donut.name +
      " — $" +
      donut.price;

    button.setAttribute(
      "aria-label",
      "Add " + donut.name + " donut"
    );

    button.onclick = () =>
      selectDonut(donut.id);

    container.appendChild(button);
  });
}

function selectDonut(id) {

  if (!game.currentOrder) {

    speak(
      "Take a customer's order first."
    );

    return;
  }

  if (!game.selected[id]) {
    game.selected[id] = 0;
  }

  game.selected[id]++;

  const donut =
    donuts.find(d => d.id === id);

  speak(
    "Added 1 " +
    donut.name +
    ". You selected " +
    game.selected[id] +
    "."
  );

  updateScreen();
}

function clearSelection() {

  game.selected = {};

  speak("Your donut selection has been cleared.");

  updateScreen();
}

function selectionsMatchOrder() {

  const order =
    game.currentOrder;

  const selected =
    game.selected;

  const orderKeys =
    Object.keys(order);

  const selectedKeys =
    Object.keys(selected)
      .filter(k => selected[k] > 0);

  if (
    orderKeys.length !== selectedKeys.length
  ) {
    return false;
  }

  for (const id of orderKeys) {

    if (
      selected[id] !== order[id]
    ) {
      return false;
    }
  }

  return true;
}

function calculateOrderValue() {

  let total = 0;

  Object.keys(game.currentOrder)
    .forEach(id => {

      const donut =
        donuts.find(d => d.id === id);

      total +=
        donut.price *
        game.currentOrder[id];
    });

  return total;
}

function serveOrder() {

  if (!game.currentOrder) {

    speak(
      "There is no order waiting."
    );

    return;
  }

  if (!selectionsMatchOrder()) {

    speak(
      "Wrong order. The customer wanted " +
      orderToSpeech(game.currentOrder) +
      ". Your order was " +
      orderToSpeech(
        game.selected
      ) +
      ". Try again."
    );

    return;
  }

  let earnings =
    calculateOrderValue();

  const upgradeBonus =
    game.upgrades.oven * 2 +
    game.upgrades.recipes * 3 +
    game.upgrades.helper * 2 +
    game.upgrades.display * 2 +
    game.upgrades.coffee * 3;

  earnings += upgradeBonus;

  game.cash += earnings;
  game.sold +=
    Object.values(game.currentOrder)
      .reduce((a, b) => a + b, 0);

  speak(
    "Order correct! Great job. " +
    "You earned $" +
    earnings +
    "."
  );

  game.currentOrder = null;
  game.selected = {};

  checkMilestones();

  randomEvent();

  saveGame();
  updateScreen();
}

function checkMilestones() {

  milestones.forEach(milestone => {

    if (
      game.sold >= milestone.sales &&
      game.level < milestone.level
    ) {

      game.level =
        milestone.level;

      game.cash +=
        milestone.reward;

      const donut =
        donuts.find(
          d => d.id === milestone.donut
        );

      speak(
        "Congratulations! " +
        "You reached level " +
        game.level +
        ". You received $" +
        milestone.reward +
        " and unlocked " +
        donut.name +
        "."
      );
    }
  });
}

function randomEvent() {

  const chance =
    Math.random();

  if (chance > 0.25) {
    return;
  }

  const events = [

    {
      text:
        "A school bus stopped by! " +
        "The shop received a $20 bonus.",
      money: 20
    },

    {
      text:
        "A food blogger visited! " +
        "Your shop received a $30 bonus.",
      money: 30
    },

    {
      text:
        "A customer left a huge tip! " +
        "You received $50.",
      money: 50
    },

    {
      text:
        "A donut delivery arrived! " +
        "You received a $40 bonus.",
      money: 40
    }
  ];

  const event =
    events[
      Math.floor(
        Math.random() *
        events.length
      )
    ];

  game.cash += event.money;

  setTimeout(() => {

    speak(event.text);

    saveGame();
    updateScreen();

  }, 1500);
}

function upgrade(type) {

  const names = {
    oven: "Oven",
    recipes: "Recipes",
    helper: "Helper",
    display: "Display Case",
    coffee: "Coffee Station"
  };

  const basePrices = {
    oven: 30,
    recipes: 45,
    helper: 80,
    display: 100,
    coffee: 150
  };

  const current =
    game.upgrades[type];

  if (current >= 3) {

    speak(
      names[type] +
      " is already fully upgraded."
    );

    return;
  }

  const price =
    basePrices[type] *
    (current + 1);

  if (game.cash < price) {

    speak(
      "You need $" +
      price +
      " to upgrade your " +
      names[type] +
      "."
    );

    return;
  }

  game.cash -= price;
  game.upgrades[type]++;

  speak(
    names[type] +
    " upgraded to level " +
    game.upgrades[type] +
    "."
  );

  saveGame();
  updateScreen();
}

function updateScreen() {

  document.getElementById("cash")
    .textContent =
    Math.floor(game.cash);

  document.getElementById("sold")
    .textContent =
    game.sold;

  document.getElementById("level")
    .textContent =
    game.level;

  document.getElementById("levelName")
    .textContent =
    levelNames[game.level] ||
    "Donut Empire";

  const next =
    milestones.find(
      m => m.sales > game.sold
    );

  document.getElementById("nextGoal")
    .textContent =
    next ? next.sales : "MAX";

  const takeButton =
    document.getElementById(
      "takeOrderButton"
    );

  takeButton.disabled =
    !!game.currentOrder;

  const serveButton =
    document.getElementById(
      "serveButton"
    );

  serveButton.disabled =
    !game.currentOrder;

  createDonutButtons();
  displayOrder();

  updateUpgradeStatus();
}

function updateUpgradeStatus() {

  const text = `
    Oven: Level ${game.upgrades.oven}/3<br>
    Recipes: Level ${game.upgrades.recipes}/3<br>
    Helper: Level ${game.upgrades.helper}/3<br>
    Display Case: Level ${game.upgrades.display}/3<br>
    Coffee Station: Level ${game.upgrades.coffee}/3
  `;

  document.getElementById(
    "upgradeStatus"
  ).innerHTML = text;
}

function shopReport() {

  const next =
    milestones.find(
      m => m.sales > game.sold
    );

  let report =
    "Shop report. " +
    "You have $" +
    Math.floor(game.cash) +
    ". " +
    "You have sold " +
    game.sold +
    " donuts. " +
    "You are level " +
    game.level +
    ", " +
    levelNames[game.level] +
    ".";

  if (next) {

    report +=
      " Your next level is at " +
      next.sales +
      " donuts sold.";
  } else {

    report +=
      " You have reached the current maximum level.";
  }

  speak(report);
}

function newGame() {

  const confirmed =
    confirm(
      "Start a new game? Your current progress will be erased."
    );

  if (!confirmed) {
    return;
  }

  game = {
    cash: 50,
    sold: 0,
    level: 1,

    upgrades: {
      oven: 0,
      recipes: 0,
      helper: 0,
      display: 0,
      coffee: 0
    },

    currentOrder: null,
    selected: {}
  };

  saveGame();
  updateScreen();

  speak(
    "New game started. Welcome to Desmond's Donut Dash!"
  );
}

loadGame();

</script>

</body>
</html>
