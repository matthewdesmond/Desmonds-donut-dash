<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Desmond's Donut Dash</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#21b9e9
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative
}

/* Uses the same artwork to fill the space around the game */
body:before{
  content:"";
  position:fixed;
  inset:-8%;
  background:url("86B0E5F4-7273-470F-AE60-F3E555414C5C.png") center/cover no-repeat;
  filter:blur(18px);
  transform:scale(1.08);
  opacity:.9;
  z-index:0
}

#game{
  position:relative;
  width:min(100vw,66.6667vh);
  height:min(150vw,100vh);
  aspect-ratio:2/3;
  overflow:hidden;
  z-index:1
}

#art{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  display:block;
  pointer-events:none;
  user-select:none
}

.hotspot{
  position:absolute;
  z-index:10;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  cursor:pointer;
  opacity:0
}

.hotspot:focus{
  opacity:.08;
  outline:3px solid #fff;
  border-radius:10px
}

#status{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap
}
</style>
</head>

<body>

<div id="game">

<img
  id="art"
  src="86B0E5F4-7273-470F-AE60-F3E555414C5C.png"
  alt=""
  aria-hidden="true"
>

<div
  id="status"
  aria-live="polite">
</div>


<!-- ======================================================
     SETTINGS
     ====================================================== -->

<button
  class="hotspot"
  style="left:90%;top:2%;width:9%;height:7%"
  aria-label="Settings"
  onclick="settings()">
</button>


<!-- ======================================================
     MONEY / BAKER BUCKS / CROWNS
     ====================================================== -->

<button
  class="hotspot"
  style="left:3%;top:17%;width:28%;height:7%"
  aria-label="Cash and earnings"
  onclick="stats()">
</button>

<button
  class="hotspot"
  style="left:31%;top:17%;width:30%;height:7%"
  aria-label="Baker Bucks"
  onclick="stats()">
</button>

<button
  class="hotspot"
  style="left:62%;top:17%;width:28%;height:7%"
  aria-label="Crowns"
  onclick="stats()">
</button>


<!-- ======================================================
     DONUT TYPES
     ====================================================== -->

<button
  class="hotspot"
  style="left:4%;top:29%;width:14%;height:9%"
  aria-label="Classic Glazed donut"
  onclick="chooseDonut('Classic Glazed')">
</button>

<button
  class="hotspot"
  style="left:18%;top:29%;width:14%;height:9%"
  aria-label="Chocolate donut"
  onclick="chooseDonut('Chocolate')">
</button>

<button
  class="hotspot"
  style="left:32%;top:29%;width:14%;height:9%"
  aria-label="Strawberry donut"
  onclick="chooseDonut('Strawberry')">
</button>

<button
  class="hotspot"
  style="left:46%;top:29%;width:14%;height:9%"
  aria-label="Blueberry donut"
  onclick="chooseDonut('Blueberry')">
</button>

<button
  class="hotspot"
  style="left:60%;top:29%;width:14%;height:9%"
  aria-label="Maple donut"
  onclick="chooseDonut('Maple')">
</button>

<button
  class="hotspot"
  style="left:74%;top:29%;width:14%;height:9%"
  aria-label="Rainbow donut"
  onclick="chooseDonut('Rainbow')">
</button>


<!-- ======================================================
     FILLINGS
     ====================================================== -->

<button
  class="hotspot"
  style="left:4%;top:41%;width:18%;height:8%"
  aria-label="Vanilla Cream filling"
  onclick="chooseFilling('Vanilla Cream')">
</button>

<button
  class="hotspot"
  style="left:22%;top:41%;width:18%;height:8%"
  aria-label="Chocolate Cream filling"
  onclick="chooseFilling('Chocolate Cream')">
</button>

<button
  class="hotspot"
  style="left:40%;top:41%;width:18%;height:8%"
  aria-label="Strawberry Jam filling"
  onclick="chooseFilling('Strawberry Jam')">
</button>

<button
  class="hotspot"
  style="left:58%;top:41%;width:18%;height:8%"
  aria-label="Blueberry Jam filling"
  onclick="chooseFilling('Blueberry Jam')">
</button>

<button
  class="hotspot"
  style="left:76%;top:41%;width:18%;height:8%"
  aria-label="Maple Cream filling"
  onclick="chooseFilling('Maple Cream')">
</button>


<!-- ======================================================
     TOPPINGS
     ====================================================== -->

<button
  class="hotspot"
  style="left:4%;top:52%;width:14%;height:8%"
  aria-label="Sprinkles topping"
  onclick="chooseTopping('Sprinkles')">
</button>

<button
  class="hotspot"
  style="left:18%;top:52%;width:14%;height:8%"
  aria-label="Chocolate Chips topping"
  onclick="chooseTopping('Chocolate Chips')">
</button>

<button
  class="hotspot"
  style="left:32%;top:52%;width:14%;height:8%"
  aria-label="Crushed Cookies topping"
  onclick="chooseTopping('Crushed Cookies')">
</button>

<button
  class="hotspot"
  style="left:46%;top:52%;width:14%;height:8%"
  aria-label="Nuts topping"
  onclick="chooseTopping('Nuts')">
</button>

<button
  class="hotspot"
  style="left:60%;top:52%;width:14%;height:8%"
  aria-label="Coconut topping"
  onclick="chooseTopping('Coconut')">
</button>

<button
  class="hotspot"
  style="left:74%;top:52%;width:14%;height:8%"
  aria-label="Drizzle topping"
  onclick="chooseTopping('Drizzle')">
</button>


<!-- ======================================================
     MAKE DONUT
     ====================================================== -->

<button
  class="hotspot"
  style="left:5%;top:64%;width:52%;height:8%"
  aria-label="Make donut"
  onclick="makeDonut()">
</button>


<!-- ======================================================
     ACTIVE ORDERS
     ====================================================== -->

<button
  class="hotspot"
  style="left:60%;top:29%;width:39%;height:7%"
  aria-label="Complete chocolate order"
  onclick="completeOrder('Chocolate')">
</button>

<button
  class="hotspot"
  style="left:60%;top:36%;width:39%;height:7%"
  aria-label="Complete strawberry order"
  onclick="completeOrder('Strawberry')">
</button>

<button
  class="hotspot"
  style="left:60%;top:43%;width:39%;height:7%"
  aria-label="Complete maple order"
  onclick="completeOrder('Maple')">
</button>


<!-- ======================================================
     NEXT CUSTOMER
     ====================================================== -->

<button
  class="hotspot"
  style="left:60%;top:50%;width:39%;height:9%"
  aria-label="Next customer"
  onclick="nextCustomer()">
</button>


<!-- ======================================================
     GALACTIC DONUT
     ====================================================== -->

<button
  class="hotspot"
  style="left:60%;top:58%;width:31%;height:15%"
  aria-label="Galactic Donut"
  onclick="useGalacticDonut()">
</button>

<button
  class="hotspot"
  style="left:91%;top:58%;width:8%;height:7%"
  aria-label="Galactic Donut information"
  onclick="galacticInfo()">
</button>


<!-- ======================================================
     BOTTOM NAVIGATION
     ====================================================== -->

<button
  class="hotspot"
  style="left:1%;top:73%;width:15%;height:10%"
  aria-label="Upgrades"
  onclick="menu('Upgrades')">
</button>

<button
  class="hotspot"
  style="left:17%;top:73%;width:15%;height:10%"
  aria-label="Locations"
  onclick="menu('Locations')">
</button>

<button
  class="hotspot"
  style="left:33%;top:73%;width:15%;height:10%"
  aria-label="Seasonal"
  onclick="menu('Seasonal')">
</button>

<button
  class="hotspot"
  style="left:49%;top:73%;width:15%;height:10%"
  aria-label="Mystery"
  onclick="menu('Mystery')">
</button>

<button
  class="hotspot"
  style="left:65%;top:73%;width:15%;height:10%"
  aria-label="Donut Rap"
  onclick="menu('Donut Rap')">
</button>

<button
  class="hotspot"
  style="left:81%;top:73%;width:18%;height:10%"
  aria-label="Achievements"
  onclick="menu('Achievements')">
</button>


<!-- ======================================================
     BOTTOM CONTROLS
     ====================================================== -->

<button
  class="hotspot"
  style="left:4%;top:83%;width:28%;height:12%"
  aria-label="Collect idle income"
  onclick="collect()">
</button>

<button
  class="hotspot"
  style="left:34%;top:82%;width:38%;height:14%"
  aria-label="Cosmic Rush"
  onclick="activateRush()">
</button>

<button
  class="hotspot"
  style="left:76%;top:83%;width:22%;height:14%"
  aria-label="Bake Create Explore Grow Enjoy"
  onclick="info()">
</button>

</div>


<script>

/* ======================================================
   GAME STATE
   ====================================================== */

let cash = 1248750;

let bakerBucks = 52;

let crowns = 8;

let idlePerSecond = 485;

let level = 1;

let xp = 0;

let goldenDonuts = 0;

let galacticDonuts = 0;

let cosmicRushSeconds = 3599;

let cosmicRushActive = true;

let selectedDonut = "Classic Glazed";

let selectedFilling = "Vanilla Cream";

let selectedTopping = "Sprinkles";


const orderValues = {

  Chocolate: 42,

  Strawberry: 56,

  Maple: 48

};


/* ======================================================
   VOICEOVER
   ====================================================== */

function speak(message){

  const status =
    document.getElementById("status");

  status.textContent = "";

  setTimeout(function(){

    status.textContent = message;

  },20);


  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const speech =
      new SpeechSynthesisUtterance(message);

    speech.rate = 1;

    speech.pitch = 1;

    speechSynthesis.speak(speech);
  }
}


/* ======================================================
   DONUT SELECTION
   ====================================================== */

function chooseDonut(type){

  selectedDonut = type;

  speak(
    type +
    " donut selected."
  );
}


function chooseFilling(type){

  selectedFilling = type;

  speak(
    type +
    " selected."
  );
}


function chooseTopping(type){

  selectedTopping = type;

  speak(
    type +
    " topping selected."
  );
}


/* ======================================================
   MAKE DONUT
   ====================================================== */

function makeDonut(){

  let message =
    "Made a " +
    selectedDonut +
    " donut with " +
    selectedFilling +
    " and " +
    selectedTopping +
    ".";


  xp += 10;


  /*
   * GOLDEN DONUT
   * 6 percent rare chance
   */

  if(Math.random() < 0.06){

    goldenDonuts++;

    bakerBucks += 12;

    idlePerSecond += 50;


    message +=
      " Golden Donut! " +
      "You earned 12 Baker Bucks " +
      "and 50 dollars per second.";
  }


  /*
   * GALACTIC DONUT
   * Rare earned power-up
   */

  if(Math.random() < 0.035){

    galacticDonuts++;

    message +=
      " Galactic Donut earned! " +
      "You now have a Galactic Donut power-up.";
  }


  levelUp();

  speak(message);
}


/* ======================================================
   COMPLETE ORDERS
   ====================================================== */

function completeOrder(type){

  let payout =
    orderValues[type] || 25;


  if(cosmicRushActive){

    payout *= 2;
  }


  cash += payout;

  xp += 8;


  let message =
    type +
    " order completed. " +
    "You earned $" +
    payout +
    ".";


  /*
   * Small chance to earn a Galactic Donut
   */

  if(Math.random() < 0.04){

    galacticDonuts++;

    message +=
      " You earned a Galactic Donut power-up!";
  }


  levelUp();

  speak(message);
}


/* ======================================================
   LEVELING
   ====================================================== */

function levelUp(){

  if(xp >= 100){

    xp -= 100;

    level++;

    speak(
      "Level up! " +
      "You are now level " +
      level +
      "."
    );
  }
}


/* ======================================================
   COLLECT IDLE INCOME
   ====================================================== */

function collect(){

  let amount =
    idlePerSecond *
    10 *
    (cosmicRushActive ? 3 : 1);


  cash += amount;


  speak(
    "Collected $" +
    amount +
    " in idle income."
  );
}


/* ======================================================
   COSMIC RUSH
   ====================================================== */

function activateRush(){

  if(cosmicRushActive){

    speak(
      "Cosmic Rush is already active."
    );

    return;
  }


  if(bakerBucks < 10){

    speak(
      "You need 10 Baker Bucks " +
      "to activate Cosmic Rush."
    );

    return;
  }


  bakerBucks -= 10;

  cosmicRushActive = true;

  cosmicRushSeconds = 600;


  speak(
    "Cosmic Rush activated " +
    "for 10 minutes."
  );
}


/* ======================================================
   GALACTIC DONUT POWER-UP
   ====================================================== */

function useGalacticDonut(){

  if(galacticDonuts < 1){

    speak(
      "You have not earned a Galactic Donut yet. " +
      "Keep making donuts and completing orders."
    );

    return;
  }


  galacticDonuts--;

  cosmicRushActive = true;

  cosmicRushSeconds = 3600;


  speak(
    "Galactic Donut used! " +
    "Cosmic Rush activated for one hour. " +
    "Idle earnings are tripled " +
    "and order payouts are doubled."
  );
}


/* ======================================================
   GALACTIC DONUT INFORMATION
   ====================================================== */

function galacticInfo(){

  speak(
    "Galactic Donut is an earned rare power-up. " +
    "Use one to activate Cosmic Rush for one hour."
  );
}


/* ======================================================
   NEXT CUSTOMER
   ====================================================== */

function nextCustomer(){

  speak(
    "Next customer is ready!"
  );
}


/* ======================================================
   SETTINGS
   ====================================================== */

function settings(){

  speak(
    "Settings opened."
  );
}


/* ======================================================
   STATS
   ====================================================== */

function stats(){

  speak(
    "You have $" +
    cash +
    ", " +
    bakerBucks +
    " Baker Bucks, " +
    crowns +
    " Crowns, " +
    "and earn $" +
    idlePerSecond +
    " per second."
  );
}


/* ======================================================
   BOTTOM MENUS
   ====================================================== */

function menu(name){

  if(name === "Upgrades"){

    idlePerSecond += 25;

    speak(
      "Upgrade purchased. " +
      "Earnings increased by 25 dollars per second."
    );

    return;
  }


  if(name === "Locations"){

    speak(
      "Locations opened."
    );

    return;
  }


  if(name === "Seasonal"){

    speak(
      "Seasonal shop opened."
    );

    return;
  }


  if(name === "Mystery"){

    speak(
      "Mystery shop opened."
    );

    return;
  }


  if(name === "Donut Rap"){

    speak(
      "Donut Rap opened."
    );

    return;
  }


  if(name === "Achievements"){

    speak(
      "Achievements opened. " +
      "Golden Donuts: " +
      goldenDonuts +
      ". Galactic Donuts: " +
      galacticDonuts +
      "."
    );

    return;
  }
}


/* ======================================================
   INFORMATION
   ====================================================== */

function info(){

  speak(
    "Desmond's Donut Dash. " +
    "Bake, create, explore, grow, and enjoy!"
  );
}


/* ======================================================
   IDLE MONEY + COSMIC RUSH TIMER
   ====================================================== */

setInterval(function(){

  cash += idlePerSecond;


  if(cosmicRushActive){

    cosmicRushSeconds--;


    if(cosmicRushSeconds <= 0){

      cosmicRushSeconds = 0;

      cosmicRushActive = false;


      speak(
        "Cosmic Rush ended."
      );
    }
  }

},1000);

</script>

</body>
</html>
